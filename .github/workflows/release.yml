name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: make

      - name: Checksums
        working-directory: dist
        run: sha256sum wsproxy-* > checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        # A dash in the tag (v1.0.0-rc1) marks a prerelease.
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes ${{ contains(github.ref_name, '-') && '--prerelease' || '' }}
